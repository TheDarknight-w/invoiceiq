services:
  invoiceiq:
    build: .
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
